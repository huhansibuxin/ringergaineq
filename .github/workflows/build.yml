name: Build RingerGainEQ
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        scheme: [rootless, roothide]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
            echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV
          else
            git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
            echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          fi
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
      - run: brew install dpkg ldid
      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: RingerGainEQ-${{ matrix.scheme }}
          path: packages/*.deb
